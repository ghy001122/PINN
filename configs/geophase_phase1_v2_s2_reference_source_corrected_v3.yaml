  active_plane_area_rule: vo2_length_times_vo2_width
  full_vertical_mesh: false
  substrate_temperature_field_recovered: false
  interdevice_substrate_resolved: false
  nonzero_dual_device_coupling_in_phase1v2: forbidden
  si_units_required: true

