S2_nominal_thermal_closure:
  role: nominal_phase1v2_production_reference_closure
  kind: local_uniform_parameter_area_normalized_single_rc
  active_plane_area_rule: vo2_length_times_vo2_width
  explicit_capacity_rule: >-
    integral_over_active_plane_of_vo2_areal_capacity_plus_electrode_mask_times_ti_au_areal_capacity
  explicit_sheet_conductance_rule: >-
    vo2_k_times_thickness_plus_electrode_mask_times_ti_au_k_times_thickness
  memory_coefficient_rule: C_m_equals_Qiu_Ctheta_minus_C_explicit
  memory_coefficient_must_be_positive: true
  normalization_geometry: nominal_20nm_contact_overlap_only
  overlap_audit_memory_rule: derive_cm_A_once_at_nominal_geometry_then_freeze_for_10_20_30nm_audits
  nonnominal_overlap_Qiu_Ctheta_identity: nonvoting_not_enforced
  areal_vertical_conductance_rule: gtheta_A_equals_Qiu_Gtheta_divided_by_active_plane_area
  areal_memory_coefficient_rule: cm_A_equals_C_m_divided_by_active_plane_area
  effective_areal_capacity_rule: Ceff_A_xy_equals_Cplane_A_xy_plus_cm_A
  vertical_sink_rule: qz_W_m2_equals_gtheta_A_times_T_minus_T0
  governing_equation: >-
    Ceff_A_xy_dT_dt_equals_divergence_Kparallel_A_xy_gradT_plus_qJ_minus_gtheta_A_times_T_minus_T0
  uniform_mode_identities:
    integrated_vertical_conductance_equals_Qiu_Gtheta: exact_preflight
    integrated_effective_capacity_equals_Qiu_Ctheta: exact_preflight
    time_constant_rule: tau_theta_equals_Qiu_Ctheta_divided_by_Qiu_Gtheta
  semantics:
    Qiu_Ctheta: uniform_mode_low_frequency_thermal_admittance_first_coefficient
    C_m: low_frequency_device_effective_coefficient_not_material_total_heat_capacity
    local_columns: engineering_closure_not_recovered_substrate_field
    intrinsic_property_claim: forbidden

S1_sensitivity_route:
  role: nonblocking_model_form_sensitivity_only_without_eligible_holdout
  protocol: configs/geophase_phase1_s1_diffusive_sensitivity_mve.yaml
  nominal_if_no_holdout: false
  may_delay_S2: false
  S1_1_or_additional_kernel_families: forbidden

physics_contract:
  electrical:
    model: in_plane_sheet_current_conservation_on_vo2_footprint
    electrode_bc: finite_contact_dirichlet
    contact_resistance: omitted_and_not_claimed
    noncontact_bc: insulating
    terminal_current: boundary_integral_of_sheet_current
  thermal:
    model: in_plane_multimaterial_areal_energy_balance_with_S2_local_single_rc_sink
    outer_lateral_bc: no_flux
    explicit_vo2_storage_and_conduction: entire_active_plane
    explicit_ti_au_storage_and_conduction: electrode_mask_only
    vertical_sink: uniform_area_normalized_device_effective_conductance
    vertical_memory_states: none_in_nominal_S2
    nonzero_interdevice_exchange: forbidden
  phase:
    vo2_conductivity: logarithmic_insulating_metallic_mix
    state_relaxation: first_order_to_branch_conditioned_equilibrium
    hysteresis: differentiable_branch_conditioned_threshold
  circuit:
    topology: source_series_load_with_parallel_device_capacitance
    load_resistance_ohm: 12000.0
    parallel_capacitance_F: 1.45e-10
  ledger:
    thermal_storage_term: integral_Ceff_A_xy_times_temperature_increment
    input_terms: [field_integrated_joule_power]
    output_terms: [S2_vertical_sink, outward_lateral_boundary_flux]
    circuit_terms: [source_power, load_resistor_power, terminal_device_power, capacitor_physical_energy_increment_rate, capacitor_backward_euler_numerical_dissipation]
    combined_storage_terms: [capacitor_physical_energy_increment_rate, S2_effective_plane_internal_energy_rate]
    device_power_identity: terminal_device_power_equals_field_integrated_joule_power
    nonfinite_or_tampered_ledger: fail_closed

reference_solver:
  spatial_discretization: conservative_cell_centered_finite_volume
  time_discretization: stateful_adaptive_implicit_backward_euler_with_independent_time_refinement
  nonlinear_coupling: damped_newton_with_fail_closed_fixed_point_fallback
  pinn_residual_code_reuse: forbidden
  base_grid: {nx: 10, ny: 25, domain_x_m: [0.0, 1.0e-7], domain_y_m: [0.0, 5.0e-7]}
  formal_spatial_refinement_levels: [1, 2, 4]
  time_grid:
    initial_time_s: 0.0
    final_time_s: 2.0e-5
    base_max_step_s: 1.0e-8
    transition_max_step_s: 2.5e-10
    divisor_rule:
      base_max_step: base_max_step_s_divided_by_time_divisor
      transition_floor: transition_max_step_s_divided_by_time_divisor
    rejected_step_rule: next_dt_equals_max_current_dt_over_2_and_floor_dt
    floor_retry_policy: exactly_one_clamped_floor_proposal_after_sixth_rejection_then_rejection_of_floor_proposal_fails_closed
    rejected_step_below_floor: proposal_forbidden_except_final_endpoint_remainder
    transition_increment_threshold: 0.02
    maximum_rejected_steps_per_accepted_step: 6
    maximum_rejected_steps_per_case: 1000
    accepted_step_policy: retain_current_dt
    growth_rule: double_after_two_easy_accepted_steps_without_rejection_or_fallback
    easy_transition_increment_max: 0.005
    endpoint_remainder_below_floor_only: true
    nonconvergence: fail_closed
  formal_time_step_divisors: [1, 2, 4]
  fixed_physical_comparison_grid:
    nx: 10
    ny: 25
    method: conservative_area_average_to_base_cells
  fixed_physical_comparison_time_grid:
    start_s: 0.0
    stop_s: 2.0e-5
    interval_s: 5.0e-9
    points: 4001
    method: monotone_time_interpolation_without_event_alignment
  nonlinear_tolerances:
    scaled_residual_relative: 1.0e-8
    scaled_residual_absolute: 1.0e-10
    scaled_update_relative: 1.0e-8
    maximum_newton_iterations: 30
    initial_damping: 1.0
    minimum_damping: 0.0078125
    armijo_coefficient: 1.0e-4
    sparse_newton_linear_solver: matrix_free_lgmres
    fixed_point_fallback_maximum_iterations: 80
    fixed_point_relaxation: 0.5
    fallback_must_meet_same_residual_tolerances: true
  linear_solver_tolerances: {relative: 1.0e-10, absolute: 1.0e-14}

formal_protocols:
  common_initial_state:
    device_voltage_V: 0.0
    active_temperature_K: 325.0
    branch_memory_b: 1.0
    conductive_state: equilibrium_at_initial_temperature_and_branch
  protocols:
    zero_drive: {kind: constant_voltage_step_at_t0, input_voltage_V: 0.0, source_role: analytic_limit}
    quiescent_9V: {kind: constant_voltage_step_at_t0, input_voltage_V: 9.0, source_role: literature_trend_probe}
    nominal_12V: {kind: constant_voltage_step_at_t0, input_voltage_V: 12.0, source_role: SI_Fig_S1_nominal_probe_not_curve_fit}
    transition_probe_12p5V: {kind: constant_voltage_step_at_t0, input_voltage_V: 12.5, source_role: qualitative_withheld_curve_regime_no_numeric_access}
    high_bias_lock_15p8V: {kind: constant_voltage_step_at_t0, input_voltage_V: 15.8, source_role: qualitative_source_trend_probe}
    pulse_12p5V: {kind: rectangular_voltage_pulse, baseline_voltage_V: 0.0, pulse_voltage_V: 12.5, pulse_start_s: 2.0e-6, pulse_stop_s: 1.2e-5, source_role: engineering_protocol}
  post_warmup_trend_window_s: [5.0e-6, 2.0e-5]

metric_contract:
  nrmse_definition: rmse_candidate_minus_fine_reference_divided_by_max_reference_change_rms_and_absolute_floor
  comparison_window_s: [0.0, 2.0e-5]
  denominator_floors: {terminal_current_A: 1.0e-12, temperature_rise_K: 1.0e-3, conductive_state_change: 1.0e-6}
  zero_signal_policy: analytic_absolute_limit_instead_of_small_denominator_pass
  nonfinite_policy: fail_closed
  event_time_matching: ordered_threshold_crossings_without_post_hoc_time_warping
  event_definition:
    signal: physical_area_weighted_domain_mean_conductive_state_s
    threshold: 0.5
    counted_directions: [upward, downward]
    upward_rule: previous_strictly_below_and_current_greater_than_or_equal
    downward_rule: previous_strictly_above_and_current_less_than_or_equal
    crossing_time: linear_interpolation_on_fixed_physical_comparison_time_grid
    equality_at_window_start: no_event_until_signal_leaves_and_recrosses
    minimum_separation_s: 5.0e-9
    boundary_policy: include_left_exclude_right_except_final_endpoint

