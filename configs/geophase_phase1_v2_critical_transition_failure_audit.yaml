analytic_diagnosis:
  transition_gate_q: 0.02
  conductive_state:
    observed_distance: d_s_equals_absolute_s_equilibrium_candidate_minus_s_n
    conditional_bound: dt_max_s_equals_q_times_tau_s_divided_by_d_s_minus_q
    applies_when: d_s_greater_than_q
    name: conditional_observed_candidate_dt_max_s
  branch_memory:
    H: h_plus_c
    A: h_times_one_minus_b_n_minus_c_times_one_plus_b_n
    conditional_bound: dt_max_b_equals_q_times_tau_b_divided_by_absolute_A_minus_q_times_H
    finite_when: absolute_A_minus_q_times_H_greater_than_zero
    nonfinite_label: no_finite_branch_dt_constraint_under_observed_activation
