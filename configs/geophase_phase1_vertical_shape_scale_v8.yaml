region_topology:
  active_vo2_storage_in_raw_reference: forbidden
  bare_vo2:
    branches: [al2o3_fixed_bottom_substrate]
  electrode_covered_vo2:
    branches_in_parallel: [al2o3_fixed_bottom_substrate, ti_au_no_flux_overlay]
  ti_au_series_between_vo2_and_al2o3: forbidden
  identical_substrate_branch_reused_by_both_regions: true
  overlay_invariant_with_substrate_depth: true
  overlay_coarse_fine_follows_requested_grid_level: true
  contact_kernel_over_whole_vo2_plane: forbidden

candidate_protocol:
  evaluation_order:
    - primary_51p2um_vs_102p4um
    - conditional_maximum_102p4um_vs_204p8um
  pairs:
    primary_51p2um_vs_102p4um:
      production_depth_m: 5.12e-5
      comparator_depth_m: 1.024e-4
    conditional_maximum_102p4um_vs_204p8um:
      production_depth_m: 1.024e-4
      comparator_depth_m: 2.048e-4
  primary_pair_pass_action: select_51p2um_and_do_not_build_204p8um
  fallback_pair_trigger:
    all_primary_mesh_passivity_identity_and_finite_checks_pass: true
    any_region_fails_either_separate_raw_depth_grid_family: true
    mesh_passivity_identity_or_nonfinite_failure_triggers_fallback: false
  foundational_failure_action: NO_GO_VERTICAL_REFERENCE
  maximum_pair_any_required_failure_action: NO_GO_VERTICAL_REFERENCE
  select_shallowest_passing_depth: true
  deeper_pair_or_full_depth_scan_without_new_authorization: forbidden

nonuniform_grid:
  inherited_from_v7_without_semantic_change: true
  coarse_first_substrate_cell_rule: exact_surface_cell_rule_value
  coarse_top_cell_m_max: 2.0e-9
  adjacent_cell_growth_ratio_max: 1.18
  deterministic_substrate_generator:
    cell_count_rule: smallest_integer_N_whose_geometric_sum_at_ratio_1p18_reaches_depth
    effective_ratio_rule: unique_bisection_root_in_1_to_1p18_whose_N_cell_geometric_sum_equals_depth
    bisection_iterations: 80
    residual_terminal_cell: forbidden
    floating_point_rounding: IEEE754_binary64
  ti_cells_coarse: 8
  au_cells_coarse: 8
  fine_grid_rule: bisect_every_coarse_cell
  material_interfaces_align_with_cell_faces: true
  coarse_and_fine_share_depth_and_boundary: true

raw_build_budget:
  primary_unique_substrate_depths_m: [5.12e-5, 1.024e-4]
  conditional_additional_substrate_depths_m: [2.048e-4]
  grid_levels: [coarse, fine]
  overlay_build_ids: [ti_au_overlay_coarse, ti_au_overlay_fine]
  primary_unique_numerical_builds: 6
  conditional_additional_numerical_builds: 2
  maximum_unique_numerical_builds: 8
  regions_do_not_duplicate_substrate_builds: true
  every_actual_raw_builder_invoked_exactly_once: true
  duplicate_build_request_returns_same_cached_object: true
  build_id_spec_hash_mismatch: fail_closed
  implicit_overlay_rebuild_outside_registry: forbidden
  full_depth_scan: forbidden

raw_shape_vote:
  depth_and_mesh_vote_object: unnormalized_raw_material_stack_reference_only
  normalized_comparator_vote: forbidden
  comparator_reanchoring: forbidden
  temporary_scale_role: coordinate_mapping_only
  temporary_scale_must_not_modify_raw_coefficients_or_amplitudes: true
  temporary_scale_source: candidate_D_fine_area_integrated_full_device_raw_reference
  temporary_ratio_definition: r_equals_a_C_divided_by_a_G
  formal_to_raw_coordinate_map:
    frequency: f_raw_equals_r_times_f_effective
    time: t_raw_equals_t_effective_divided_by_r
  grid_families:
    inherited_raw:
      source: formal_v6_held_out_geometric_midpoints
      frequency_band_Hz: [1.0e3, 1.0e10]
      time_start_s: 1.0e-10
      time_stop_s: 2.0e-5
    formal_window_pullback:
      source: apply_candidate_temporary_r_to_each_formal_v6_held_out_midpoint
      frequency_rule: r_times_each_formal_frequency_midpoint
      time_rule: each_formal_time_midpoint_divided_by_r
  grid_families_must_be_evaluated_and_gated_separately: true
  concatenated_or_weighted_cross_family_RMSE: forbidden
  response_metrics:
    step_error_formula: RMSE_candidate_minus_reference_divided_by_max_RMS_reference_minus_reference_at_zero_1e_minus_30
    impulse_error_formula: RMSE_candidate_minus_reference_divided_by_max_RMS_reference_1e_minus_30
    frequency_error_formula: RMSE_log_max_abs_candidate_1e_minus_300_minus_log_max_abs_reference_1e_minus_300
  comparison_roles:
    mesh_D: candidate_D_coarse_reference_D_fine
    mesh_2D: candidate_2D_coarse_reference_2D_fine
    depth: candidate_D_fine_reference_2D_fine
  voting_responses_for_depth_and_mesh: [step, frequency]
  impulse_depth_selection_role: reported_nonvoting_diagnostic

vertical_gates:
  each_grid_family_mesh_step_error_max: 1.0e-2
  each_grid_family_mesh_frequency_error_max: 1.0e-2
  each_grid_family_depth_step_error_max: 5.0e-2
  each_grid_family_depth_frequency_error_max: 5.0e-2
  every_region_and_each_grid_family_must_pass_separately: true
  positive_capacities_required: true
  positive_conductances_required: true
  strictly_negative_real_poles_required: true
  conductance_matrix_positive_definite_required: true
  minimum_real_admittance_relative_margin: -1.0e-12
  identity_relative_tolerances:
    step_initial: 1.0e-10
    step_DC: 1.0e-10
    impulse_integral: 1.0e-10
    impulse_step_derivative: 1.0e-10
    frequency_state_space: 1.0e-10
  nonfinite_policy: fail_closed

production_normalization:
  compute_only_after_raw_production_depth_is_selected: true
  normalization_source: selected_D_star_fine_area_integrated_full_device_raw_reference
  raw_device_conductance: sum_over_regions_A_r_times_G_r
  raw_device_memory_capacity: sum_over_regions_A_r_times_C_r
  target_conductance_source: formal_v6_nominal_total_thermal_conductance_W_K
  target_memory_capacity_source: formal_v6_nominal_memory_capacity_target_J_K_after_active_plane_subtraction
  conductance_scale: a_G_equals_G_target_divided_by_G_raw
  capacity_scale: a_C_equals_C_memory_target_divided_by_C_raw
  apply_one_identical_scale_pair_to:
    - bare_vo2
    - electrode_covered_vo2
    - al2o3_substrate_branch
    - ti_au_overlay_branch
  region_branch_or_comparator_specific_normalization: forbidden
  normalized_deeper_comparator_construction: forbidden
  required_equivalence: Y_eff_of_s_equals_a_G_times_Y_raw_of_a_C_divided_by_a_G_times_s
  scaled_production_required_checks:
    - exact_global_G_anchor
    - exact_global_memory_C_anchor
    - passivity
    - response_identities
    - finite_values
  allowed_claim: device-effective_amplitude_time_normalization_of_a_source-shape-constrained_passive_thermal_kernel
  forbidden_claims:
    - intrinsic_local_material_calibration
    - Qiu_device_reproduction
    - scaled_depth_invariance

k_state_contract:
  truth_reference: selected_device_effective_production_D_star_fine_full_state_space_kernel
  regions: [bare_vo2, electrode_covered_vo2]
  ablation_order: 1
  candidate_orders: [2, 3]
  high_order_benchmark: 8
  common_production_order_required: true
  mixed_region_production_orders: forbidden
  evaluation_order:
    - fit_K2_for_both_regions
    - fit_K3_for_both_regions_only_if_K2_not_jointly_passing
    - after_common_candidate_selected_fit_K1_ablation_and_K8_benchmark
  K1_or_K8_may_select_or_change_common_production_order: false
  K8_validation_role: required_high_order_reduced_benchmark_after_common_candidate_selection
  K8_must_pass_full_kernel_validation: true
  K1_validation_role: reported_ablation_not_production_selection
  deterministic_initializations:
    selection_before_validation: minimum_fitting_objective_among_optimizer_success_and_finite_results
    validation_result_may_not_select_or_retry_start: true
    objective_tie_breaker: listed_initialization_order
    maximum_initializations_per_order_region: 3
    starts:
      - id: equal_capacity_equal_resistance
        capacity_weight_geometric_ratio_surface_to_terminal: 1.0
        resistance_fraction_geometric_ratio_surface_to_terminal: 1.0
      - id: increasing_capacity_increasing_resistance
        capacity_weight_geometric_ratio_surface_to_terminal: 2.0
        resistance_fraction_geometric_ratio_surface_to_terminal: 2.0
      - id: decreasing_capacity_decreasing_resistance
        capacity_weight_geometric_ratio_surface_to_terminal: 0.5
        resistance_fraction_geometric_ratio_surface_to_terminal: 0.5
    capacity_weights_normalized_to_reference_total_capacity: true
    resistance_fractions_normalized_to_one: true
    link_conductance_rule: reference_DC_conductance_divided_by_normalized_resistance_fraction
  optimizer:
    method: scipy_least_squares_log_positive_parameters
    relative_objective_tolerance: 1.0e-10
    maximum_function_evaluations_per_start: 20000
    optimizer_success_required: true
    finite_parameters_objective_and_diagnostics_required: true
  independent_validation_grid: held_out_geometric_midpoints_from_formal_v6_fit_grids
  validation_gates:
    step_response_nrmse_max: 5.0e-2
    impulse_response_nrmse_max: 5.0e-2
    frequency_log_magnitude_rmse_max: 5.0e-2
    positive_capacities_and_conductances_required: true
    strictly_negative_real_poles_required: true
    admittance_passive_required: true
  all_required_optimizer_results_absent_status: NO_GO_K_STATE_OPTIMIZATION
  K8_or_K3_required_metric_failure_status: NO_GO_K_STATE

runtime_readiness:
  enabled_only_after_vertical_and_K_state_pass: true
  cpu_only: true
  maximum_preflight_wall_clock_s: 900
  preflight_ids_must_not_overlap_formal_inventory: true
