deterministic_resolution:
  schema_version: geophase_phase1_v2_controller_overlay_resolution_v1
  algorithm: >-
    Load the byte-verified base S2 YAML, validate this document against the
    exact overlay schema, add only the two whitelisted reference-solver paths,
    and canonicalize the resolved controller identity as UTF-8 JSON with
    sorted keys and compact separators.
  whitelisted_base_paths:
    - reference_solver.time_discretization
    - reference_solver.active_time_controller
  exact_operations:
    - {operation: REPLACE, path: /reference_solver/time_discretization}
    - {operation: ADD, path: /reference_solver/active_time_controller}
  DELETE_operation: forbidden
  additional_overlay_paths: forbidden
  top_level_overlay_key: controller_overlay
  resolved_runtime_identity_fields:
    - base_S2_config_sha256
    - controller_v2_overlay_sha256
    - resolution_schema_version
  resolved_runtime_identity_formula: sha256_of_canonical_JSON_of_the_three_identity_fields
  canonical_JSON:
    encoding: UTF-8
    sort_keys: true
    separators: [",", ":"]
    allow_nan: false
  current_overlay_must_match_preregistration_commit_bytes: true
  base_config_must_match_preregistration_commit_bytes: true
  forbidden_override_namespaces:
    - physical_model
    - geometry
    - source_scale
    - material_parameters
    - formal_protocols
    - formal_manifest
    - metric_contract
    - gates
    - spatial_grid
    - frozen_GT

overlay_schema:
  additional_properties: forbidden
  controller_overlay_required_keys: [reference_solver]
  reference_solver_allowed_keys: [time_discretization, active_time_controller]
  active_time_controller_allowed_keys:
    - controller_id
    - candidate_paths
    - embedded_error
    - voltage_scale
    - outer_interval
    - growth
    - integrity
    - aggregate_ledgers
    - event_output_isolation
    - telemetry

controller_overlay:
  reference_solver:
    time_discretization: stateful_embedded_backward_euler_full_step_two_half_step_v2
    active_time_controller:
      controller_id: embedded_time_consistency_v2_only
      candidate_paths:
        full_step:
          backward_euler_steps: 1
          step_fraction_of_outer_interval: 1.0
          role: temporal_error_estimate_and_integrity_only
          may_commit_state_or_QoI: false
        two_half_steps:
          backward_euler_steps: 2
          ordered_step_fractions_of_outer_interval: [0.5, 0.5]
          role: accepted_state_path
          second_half_starts_from_first_half_state: true
      embedded_error:
        temperature_scale_K: 7.19
        e_T: infinity_norm_T_hh_minus_T_h_divided_by_temperature_scale_K
        e_s: infinity_norm_s_hh_minus_s_h
        e_b: infinity_norm_b_hh_minus_b_h
        e_V: absolute_V_hh_minus_V_h_divided_by_fixed_protocol_V_scale
        e_max: maximum_of_e_T_e_s_e_b_e_V
        acceptance_max: 0.02
        legacy_max_delta_s_delta_b_role: telemetry_only_nonvoting
      voltage_scale:
        formula: max_1V_and_maximum_absolute_declared_input_voltage_over_protocol
        runtime_or_device_voltage_dependent_denominator: forbidden
        missing_protocol_mapping: fail_closed
        protocol_V_scale_V:
          zero_drive: 1.0
          quiescent_9V: 9.0
          nominal_12V: 12.0
          transition_probe_12p5V: 12.5
          high_bias_15V: 15.0
          pulse_12p5V: 12.5
        multi_device_or_multi_input_rule: resolve_and_record_each_device_input_channel_before_execution
        DUAL0_fixture_device_channel_V_scale_V:
          A_only_drive: {A: 12.5, B: 1.0}
          B_only_drive: {A: 1.0, B: 12.5}
          equal_drive_symmetry: {A: 12.5, B: 12.5}
          swapped_label_invariance: {A: 12.5, B: 12.5}
      outer_interval:
        symbol: H
        base_maximum_s: 1.0e-8
        emergency_floor_base_s: 9.765625e-12
        formal_time_divisors: [1, 2, 4]
        divisor_rule:
          maximum: base_maximum_s_divided_by_time_divisor
          emergency_floor: emergency_floor_base_s_divided_by_time_divisor
        emergency_floor_applies_to: outer_interval_H_only
        half_steps_below_outer_floor: allowed
        initial_H: maximum_for_time_divisor
        rejection_action_above_floor: halve_outer_interval
        outer_rejection_cap: 10
        rejection_count_unit: one_failed_full_two_half_candidate_bundle
        floor_ladder: evaluate_Hmax_then_at_most_10_halvings_and_evaluate_Hmin_once
        floor_candidate_failure: locked_floor_failure_not_ordinary_eleventh_rejection
        proposal_below_floor: forbidden_except_endpoint_or_forced_landing_remainder
        endpoint_or_forced_landing_remainder:
          allowed_targets: [final_time, fixed_output_time, protocol_discontinuity]
          adaptive_floor_search: forbidden
          failed_integrity_or_embedded_gate: fail_closed_without_further_bisection
      growth:
        accepted_interval_policy: retain_current_H
        easy_error_max: 0.005
        required_consecutive_easy_intervals: 2
        each_easy_interval_requires: [no_rejection, no_fallback]
        action: double_H_capped_at_divisor_maximum
        PID_or_safety_factor: forbidden
      integrity:
        required_for_each_path: [full_step, first_half_step, second_half_step]
        hard_gates:
          - finite_state
          - nonlinear_convergence
          - lateral_flux_audit
          - thermal_ledger
          - circuit_ledger
          - combined_ledger
          - device_power_identity
        path_failure_above_floor: reject_bundle_and_halve_outer_interval
        path_failure_at_floor_or_remainder: fail_closed
        lateral_audit_formula: existing_relative_OR_64eps_Lnorm_Tnorm_backward_error
        third_lateral_acceptance_criterion: forbidden
      aggregate_ledgers:
        hard_gate_for_accepted_two_half_path: true
        ledgers: [thermal, circuit, combined, device_power_identity]
        recompute_from_signed_energy_terms: true
        relative_residual_averaging: forbidden
        storage: net_outer_initial_to_second_half_final
        midpoint_storage: algebraically_cancels_once
        accumulated_terms:
          - input_energy
          - load_dissipation
          - vertical_sink_energy
          - lateral_flux_energy
          - circuit_capacitor_backward_euler_numerical_dissipation_each_half_once
        device_power_identity: sum_dt_times_terminal_device_power_equals_sum_dt_times_field_joule_power
        thresholds: inherit_existing_four_ledger_thresholds_without_relaxation
      event_output_isolation:
        protocol_discontinuity_and_fixed_output_times: exact_outer_interval_landing
        each_half_uses_its_own_time_interval_voltage: true
        events_streaming_QoI_and_snapshots_source: accepted_two_half_path_only
        full_step_pollution: forbidden
      telemetry:
        legacy_max_absolute_delta_s: required_nonvoting
        legacy_max_absolute_delta_b: required_nonvoting
        embedded_components: [e_T, e_s, e_b, e_V, e_max]
        path_integrity: [full_step, first_half_step, second_half_step, aggregate]
        coupled_solve_count_per_successful_outer_candidate: 3

readiness_validation:
  formal: false
  id_prefix: PRE-CTRL-
  temporary_directory_only: true
  formal_execution_count: 0
  formal_artifact_count: 0
  sequential_gates: [C1, C2, C3]
  C1:
    id: PRE-CTRL-LEGAL-CRITICAL
    fixture_source: PR7_legal_critical_initial_state_and_transition_probe_12p5V
    fixture:
      spatial_level: 1
      grid: {nx: 10, ny: 25}
      time_divisor: 1
      initial_state: {temperature_K: 336.4, branch_memory_b: 1.0, conductive_state_s: 0.5, device_voltage_V: 0.0}
      protocol: transition_probe_12p5V
      final_time_s: 2.0e-8
      forced_landing_times_s: [0.0, 5.0e-9, 1.0e-8, 1.5e-8, 2.0e-8]
    required:
      - accepted_interval_exists
      - embedded_error_pass
      - full_half_and_aggregate_integrity_pass
      - accepted_two_half_path_reproducible
      - full_history_streaming_parity
    floor_failure_disposition: NO_GO_TIME_CONTROLLER_REVISION
  C2:
    fixture: identical_to_C1_legal_critical_initial_state_grid_divisor_and_protocol
    maximum_accepted_intervals: 128
    maximum_simulated_time_s: 1.0e-6
    wall_clock_scope: remaining_runtime_preflight_budget
    stop_at_first_limit: true
    missing_reversal_or_event: NA_not_observed_within_bounded_C2_window
    event_or_reversal_if_present_requires_full_history_streaming_parity: true
    wall_clock_truncation: C2_truncated_by_readiness_budget
    insufficient_samples_for_C3: NO_GO_RUNTIME_PERFORMANCE_ONLY
    formal_event_or_trend_vote: forbidden
  C3:
    inherit_execution_addendum_runtime_preflight: true
    wall_clock_s_max_for_C1_C2_C3_runtime_preflight: 900
    grids: [L1, L2, L4]
    deterministic_states: [equilibrium, legal_critical, high_conductive]
    campaign_cost_unique_units: 60
    scheduler: deterministic_longest_processing_time_first
    coupled_solve_cost_multiplier_must_be_measured_not_assumed: true
    dormant_formal_runner_only: true
    formal_registry_or_ID: forbidden
    GO_gates:
      predicted_p95_makespan_s_max: 11520
      hard_makespan_s_max: 14400
      formal_execution_count: 0
      formal_artifact_count: 0

