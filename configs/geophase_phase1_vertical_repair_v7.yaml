  ti_cells_min: 8
  au_cells_min: 8
  coarse_ti_grid_rule: uniform_exactly_8_cells
  coarse_au_grid_rule: uniform_exactly_8_cells
  fine_grid_rule: bisect_every_coarse_cell
  coarse_and_fine_share_depth: true
  coarse_and_fine_share_remote_boundary: true
