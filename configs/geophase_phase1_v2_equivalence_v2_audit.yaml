field_rules:
  A_primary_physical:
    threshold: 1.0e-12
    threshold_change: forbidden
    comparator: strict_equivalence_v1_normalized_relative_difference
    fields:
      - T
      - s
      - b
      - V_d
      - phi
      - terminal_current
      - field_Joule_power
      - device_Joule_power
      - thermal_ledger
      - circuit_ledger
      - combined_ledger
      - device_power_ledger
      - embedded_temporal_error
    missing_extra_or_nonfinite: VALID_FAIL
  B_topology_and_state_machine:
    comparator: exact_match
    fields:
      - nonlinear_method
      - converged_disposition
      - fallback_disposition
      - accepted_rejected_sequence
      - failure_classification
      - event_count_direction_and_order
      - reversal_count_direction_and_order
    missing_extra_or_validation_error: VALID_FAIL
  C_lateral_conservation_and_flux:
    physical_fluxes:
      voting: true
      threshold_ratio: 1.0
      empirical_multiplier: forbidden
      x_face_bound: 2*g_x_max*delta_T_inf + 64*machine_epsilon*max(g_x_max*T_scale,q_scale)
      y_face_bound: 2*g_y_max*delta_T_inf + 64*machine_epsilon*max(g_y_max*T_scale,q_scale)
      net_cell_bound: L_infinity_norm*delta_T_inf + 64*machine_epsilon*max(L_infinity_norm*T_scale,q_scale)
    hard_gate:
      voting: true
      predicate: matrix_face_relative_mismatch_le_1e-10_OR_matrix_face_roundoff_ratio_le_1
      required: candidate_and_oracle_each_pass_and_dispositions_match
    cancellation_roundoff:
      voting: true
      bound: 64*machine_epsilon*2*(n_x_faces*q_x_scale+n_y_faces*q_y_scale)
      raw_signed_values_preserved: true
    observed_difference_derived_threshold: forbidden
  complete_field_contract:
    source: mechanically_derived_638_family_qualified_parameterized_templates
    unregistered_extra_field: VALID_FAIL
    conditionally_required_missing_field: VALID_FAIL
    invalid_NA_or_validation_error: VALID_FAIL

