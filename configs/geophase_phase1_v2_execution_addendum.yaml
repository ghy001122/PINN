    create_registry_and_set_formal_execution_count_to_1_atomically_before_first_unit_is_scheduled: true
    same_run_ID_resume_does_not_increment_count: true
    second_real_run_ID: forbidden

readiness_disposition:
  allowed: [GO_FOR_PHASE1_V2_FORMAL_AUTHORIZATION, NO_GO_RUNTIME]
