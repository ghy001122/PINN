execution_dependency_graph:
  evaluation_item_count: 63
  unique_execution_unit_count: 60
  reused_evaluation_count: 3
  mapping_rule: >-
    Every non-reused manifest row maps to its declared trajectory_id as one
    execution unit. Each TOP O20 row maps to the identical REF S4T4
    trajectory_id named in dependency_ids and creates no new execution unit.
  reuse_rows:
    - evaluation_id: P1V2-TOP-O20-nominal_12V
      dependency_id: P1V2-REF-nominal_12V-S4T4
    - evaluation_id: P1V2-TOP-O20-transition_probe_12p5V
      dependency_id: P1V2-REF-transition_probe_12p5V-S4T4
    - evaluation_id: P1V2-TOP-O20-high_bias_15V
      dependency_id: P1V2-REF-high_bias_15V-S4T4
