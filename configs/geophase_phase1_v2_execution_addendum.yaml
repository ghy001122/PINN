foundation_fail_fast:
  pre_inventory_checks:
    - insulating_electrical_endpoint
    - metallic_electrical_endpoint
    - C_m_positivity_and_nominal_capacity_identity
    - area_integrated_Gtheta_identity
    - electrode_mask_capacity_and_sheet_conductance_identity
  formal_foundation_groups: [FAIL, MMS, LIM]
  dynamic_foundation_checks:
    - finite_state_and_outputs
    - nonlinear_convergence_or_locked_fail_closed_fallback
    - terminal_current_balance
    - device_power_identity
    - thermal_ledger
    - circuit_ledger
    - combined_ledger
    - lateral_matrix_face_parity
  failure_action: >-
    Atomically preserve completed evidence, classify the scientific or
    contract failure, mark every unscheduled dependent evaluation blocked, and
    stop scheduling costly dynamic units.
  later_comparative_or_trend_failure: >-
    Record COMPLETED_SCIENTIFIC_FAIL after the dependency set required to
    evaluate that gate is complete; never alter a gate or protocol.

group_execution_semantics:
  MMS:
    spatial_level: from_existing_manifest_row
    time_rule: minimal_manufactured_fixture_declared_by_existing_problem
    protocol: analytic_manufactured_source_not_a_formal_voltage_trend
  REF:
    final_time_s: 2.0e-5
    protocol: from_existing_manifest_row
    spatial_level: from_existing_manifest_row
    time_divisor: from_existing_manifest_row
    spatial_pairing:
      diagnostic_coarse_pair: [S1T4, S2T4]
      voting_fine_pair: [S2T4, S4T4]
    temporal_pairing:
      diagnostic_coarse_pair: [S4T1, S4T2]
      voting_fine_pair: [S4T2, S4T4]
    event_pairing_uses_same_spatial_and_temporal_pairs: true
  TOP:
    spatial_level: 4
    time_divisor: 4
    final_time_s: 2.0e-5
    protocols: [nominal_12V, transition_probe_12p5V, high_bias_15V]
    overlap_m: [1.0e-8, 2.0e-8, 3.0e-8]
    O20_rule: exact_reuse_of_matching_REF_S4T4
    O10_and_O30_rule: independent_trajectories
    nominal_cm_A_frozen_for_all_overlaps: true
  DUAL0:
    spatial_level: 1
    time_divisor: 1
    final_time_s: 2.0e-5
    coupling: exactly_zero
    fixtures:
      A_only_drive: {protocol_A: transition_probe_12p5V, voltage_A_V: 12.5, protocol_B: zero_drive, voltage_B_V: 0.0}
      B_only_drive: {protocol_A: zero_drive, voltage_A_V: 0.0, protocol_B: transition_probe_12p5V, voltage_B_V: 12.5}
      equal_drive_symmetry: {protocol_A: transition_probe_12p5V, voltage_A_V: 12.5, protocol_B: transition_probe_12p5V, voltage_B_V: 12.5}
      swapped_label_invariance: {protocol_A: transition_probe_12p5V, voltage_A_V: 12.5, protocol_B: transition_probe_12p5V, voltage_B_V: 12.5, compare_after_A_B_label_swap: true}
  FAIL:
    spatial_level: 1
    time_divisor: 1
    stop: immediately_when_expected_failure_is_triggered_and_verified
    maximum_time_s: 2.0e-5
    fixtures:
      negative_effective_capacity: {protocol: zero_drive, trigger: constructor_or_first_assembly_validation}
      negative_vertical_conductance: {protocol: zero_drive, trigger: constructor_or_first_assembly_validation}
      nonfinite_newton: {protocol: transition_probe_12p5V, trigger: first_nonlinear_residual_evaluation}
      ledger_tamper: {protocol: transition_probe_12p5V, trigger: first_accepted_step_ledger_validation}
      coordinate_swap: {protocol: zero_drive, trigger: grid_contract_validation_before_solve}
  LIM:
    fixtures:
      zero_drive_equilibrium:
        spatial_level: 1
        time_divisor: 1
        final_time_s: 2.0e-5
        protocol: zero_drive
        execution: trajectory_required_for_locked_drift_gate
      uniform_conductivity_linear_potential:
        spatial_level: 1
        execution: one_static_electrical_solve
        protocol: analytic_unit_voltage_boundary
      zero_joule_cooling:
        spatial_level: 1
        time_divisor: 1
        execution: one_backward_euler_step
        protocol: zero_drive
      steady_thermal_resistance:
        spatial_level: 1
        execution: minimal_analytic_or_single_linear_solve_fixture
        protocol: constant_areal_heat_source
      local_single_cell_backward_euler:
        spatial_level: 1
        time_divisor: 1
        execution: one_cell_one_backward_euler_step
        protocol: analytic_heat_input
      rc_open_device:
        spatial_level: 1
        time_divisor: 1
        execution: one_analytic_or_backward_euler_RC_step
        protocol: existing_RC_open_device_fixture

event_comparison_contract:
  comparison_signal: physical_area_weighted_domain_mean_conductive_state_s
  crossing_definition_source: authority_lock.S2_config
  time_gate_s: 5.0e-8
  protocol_requires_events:
    transition_probe_12p5V: true
    zero_drive: false
    quiescent_9V: false
    nominal_12V: false
    high_bias_15V: false
    pulse_12p5V: false
  both_zero_and_protocol_does_not_require_events: NA
  one_side_missing_events: FAIL
  event_count_mismatch: FAIL
  direction_or_order_mismatch: FAIL
  matched_rule: pair_in_order_and_vote_maximum_absolute_time_difference
  required_protocol_zero_events: >-
    Event convergence is NA but the existing literature-trend gate fails; the
    trend gate is never replaced by event-comparison NA.

source_envelope_noise_contract:
  evaluated_independently_per_protocol_and_qoi: true
  protocols: [nominal_12V, transition_probe_12p5V, high_bias_15V]
  qois:
    terminal_current_A:
      definition: RMS_terminal_current_on_fixed_4001_point_grid_over_0_to_20us
      epsilon_q: 1.0e-12
      epsilon_source: existing_metric_denominator_floor_terminal_current_A
    temperature_rise_K:
      definition: maximum_domain_temperature_minus_ambient_on_fixed_4001_point_grid
      epsilon_q: 1.0e-3
      epsilon_source: existing_metric_denominator_floor_temperature_rise_K
    conductive_state_change:
      definition: maximum_absolute_area_weighted_mean_s_minus_initial_on_fixed_4001_point_grid
      epsilon_q: 1.0e-6
      epsilon_source: existing_metric_denominator_floor_conductive_state_change
  envelope_formula: E_equals_max_q10_q20_q30_minus_min_q10_q20_q30
  numerical_noise_formula: N_equals_absolute_qS4T4_minus_qS2T4_at_nominal_20nm
  vote_formula: E_divided_by_max_N_epsilon_q_greater_than_or_equal_to_1
  cross_protocol_or_cross_qoi_averaging: forbidden
  post_observation_epsilon_change: forbidden

topology_claim_boundary:
  contact_overlap_qoi_reporting: required
  geometry_robust_wording: >-
    Allowed only for a protocol/QoI whose overlap effect does not exceed its
    matching nominal-geometry spatial S2T4-to-S4T4 fine-pair error.
  failed_source_envelope_vote: >-
    The corresponding source-envelope trend cannot vote and the all-required-
    gates formal disposition is scientific fail; no protocol or QoI averaging
    may hide it.
  forbidden_claims:
    - geometry_robustness_when_overlap_effect_exceeds_discretization_error
    - source_envelope_trend_when_E_over_max_N_epsilon_is_below_one
    - Qiu_device_calibration_or_reproduction

streaming_contract:
  fixed_scalar_sample_grid:
    start_s: 0.0
    stop_s: 2.0e-5
    points: 4001
    interval_s: 5.0e-9
    solver_must_land_exactly_on_each_sample: true
  scalar_records_at_every_sample:
    - port_observables
    - state_summaries
    - thermal_ledger
    - circuit_ledger
    - combined_ledger
    - device_power_ledger
    - scalar_event_bookkeeping
  fixed_full_field_times_s: [0.0, 5.0e-6, 1.0e-5, 1.5e-5, 2.0e-5]
  include_protocol_discontinuity_full_fields: true
  solver_must_land_on_full_field_and_protocol_discontinuity_times: true
  event_full_field_snapshots:
    snapshot_before_and_after_each_retained_event: true
    maximum_snapshots: 16
    when_event_count_at_most_8: retain_before_and_after_all_events
    when_event_count_above_8: retain_before_and_after_earliest_4_and_latest_4_events
    scalar_event_records_for_unretained_middle_events: complete
  accepted_step_full_field_history: forbidden
  memory_scaling: independent_of_accepted_steps_times_full_grid_history
  per_case_output:
    write_to_case_temporary_directory: true
    validate_schema_hashes_and_completion_marker_before_publish: true
    publish_with_atomic_rename: true
  output_order: [case_JSON_and_CSV, campaign_JSON_and_CSV, figures, report]

mathematically_equivalent_optimization_contract:
  baseline_optimizations_not_counted_as_performance_repair:
    - streaming
    - reuse_FVM_topology_and_sparse_structure
    - cache_invariant_matrices_or_factorizations
    - frozen_context_unit_voltage_potential_scaling_and_quadratic_Joule_scaling
    - case_level_CPU_parallelism
  unit_voltage_scaling_scope:
    same_geometry_and_grid_required: true
    identical_frozen_temperature_s_and_conductivity_context_required: true
    cross_Newton_or_Picard_state_reuse: forbidden
    cross_accepted_step_reuse: forbidden
  parity_required_for_each_optimization:
    outputs: [full_fields, ports, conductive_and_branch_states, thermal_ledger, circuit_ledger, combined_ledger, device_power_ledger]
    relative_tolerance: 1.0e-12
    absolute_floor_source: existing_SI_denominator_floors
    cached_and_uncached_paths_must_both_be_exercised: true
  lateral_matrix_face_audit:
    formula_id: lateral_matrix_face_parity_v1
    acceptance: relative_mismatch_le_1e-10_OR_roundoff_ratio_le_1
    backward_error_bound: 64_times_float64_epsilon_times_max_L_infinity_norm_1e-300_times_max_T_l2_norm_1
    tamper_must_fail_both_paths: true
    third_acceptance_criterion: forbidden
  worker_runtime:
    BLAS_threads_per_worker: 1
    OpenMP_threads_per_worker: 1
    safe_worker_count_rule: min_physical_cores_and_memory_limited_worker_count

runtime_preflight:
  formal: false
  id_prefix: PRE-
  temporary_directory_only: true
  formal_artifacts: forbidden
  formal_execution_count: 0
  cpu_only: true
  wall_clock_s_max: 900
  wall_clock_scope: preflight_only_excludes_tests_and_CI
  launch_environment_measurements:
    - total_and_available_RAM
    - physical_and_logical_core_count
    - disk_total_and_free_bytes
    - safe_worker_count
    - BLAS_and_OpenMP_thread_settings
  grids:
    L1: {nx: 10, ny: 25, spatial_level: 1}
    L2: {nx: 20, ny: 50, spatial_level: 2}
    L4: {nx: 40, ny: 100, spatial_level: 4}
  deterministic_states:
    equilibrium:
      temperature_K: ambient_temperature_K
      branch_memory: 1.0
      conductive_state: equilibrium_at_temperature_and_branch
      short_protocol: zero_drive
    legal_critical:
      temperature_K: T_c_up_K
      branch_memory: 1.0
      conductive_state: 0.5
      short_protocol: transition_probe_12p5V
    high_conductive:
      temperature_K: upper_validity_temperature_380K
      branch_memory: 1.0
      conductive_state: equilibrium_at_temperature_and_branch
      short_protocol: high_bias_15V
  initial_state_or_protocol_search: forbidden
  single_step_matrix:
    cartesian_product: [3_grids, 3_states, base_dt_and_floor_dt]
    expected_samples: 18
  short_trajectory_matrix:
    cartesian_product: [3_grids, 3_states]
    stop_at_first: [128_accepted_steps, 1.0e-6_simulated_seconds]
    expected_samples: 9
  optional_coarse_transition_trajectory:
    grid: L1
    protocol: transition_probe_12p5V
    final_time_s: 2.0e-5
    wall_clock_stop_s: 600
    early_wall_clock_stop_alone_is_not_NO_GO: true
    evaluate_oscillation_or_trend_gate: false
    telemetry_only: true
  required_telemetry:
    - accepted_and_rejected_steps
    - Newton_iterations
    - Krylov_iterations
    - Armijo_backtracks
    - fixed_point_fallback_count
    - p50_p90_and_max_step_wall_time_s
    - accepted_dt_distribution
    - nonfinite_and_convergence_failures
    - four_ledgers
    - peak_RSS_bytes
    - predicted_disk_bytes
    - streaming_output_bytes
  target_machine_binding: environment_hash
  different_formal_machine_requires_identical_preflight_rerun: true

campaign_cost_forecast:
  unit_count: 60
  scheduler: deterministic_longest_processing_time_first
  accepted_step_forecast:
    observed_rate: maximum_accepted_steps_per_simulated_second_over_matching_grid_and_three_deterministic_states
    time_divisor_scaling: multiply_observed_T1_rate_by_formal_time_divisor
    optional_long_prefix: include_by_taking_the_max_rate_if_any_prefix_exists
    unreserved_steps: ceil_duration_times_observed_rate_times_time_divisor
    safety_steps: ceil_1p25_times_unreserved_steps
    absolute_floor_bound_reported_separately: ceil_duration_divided_by_locked_floor_dt
  unit_wall_clock_forecast:
    unreserved: one_observed_max_step_plus_remaining_unreserved_steps_times_observed_p90_step_time_plus_streaming_IO
    with_safety: one_observed_max_step_plus_remaining_safety_steps_times_1p25_observed_p90_step_time_plus_1p25_streaming_IO
    dual0_multiplier: 2.0
    TOP_O10_O30_geometry_multiplier: 1.10
  worker_count:
    physical_core_limit: one_worker_per_physical_core
    memory_limit: floor_0p70_times_available_RAM_divided_by_peak_worker_RSS
    selected: minimum_of_physical_core_and_memory_limits_at_least_one
  GO_gates:
    safety_margin_LPT_makespan_s_max: 11520
    unreserved_LPT_makespan_s_max: 14400
    aggregate_worker_RSS_fraction_of_launch_available_RAM_max: 0.70
    disk_free_fraction_after_forecast_min: 0.20
    preflight_wall_clock_s_max: 900
    parity_nonfinite_ledger_and_critical_state_failures: 0
  target_machine_only: true

performance_repair_policy:
  baseline_streaming_sparse_cache_and_parallelism_consume_repair: false
  performance_repair_limit: 1
  current_performance_repair_count: 0
  eligibility: >-
    All parity, finite, ledger, scientific-foundation, and critical-state
    stability checks pass and the only failing readiness criterion is campaign
    cost.
  allowed_repair: mathematically_equivalent_pure_engineering_optimization_only
  rerun: exactly_the_same_runtime_preflight_once
  second_performance_failure: NO_GO_RUNTIME
  existing_S2_implementation_repair_quota: exhausted
  new_physics_conservation_or_nonlinear_implementation_defect: stop_preserve_evidence_and_request_user_decision

