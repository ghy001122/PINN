  cancellation_residue_above_roundoff_bound_must_fail: true
  missing_required_field_must_fail: true

decision_rule:
  GO_VERSIONED_EQUIVALENCE_V2_AUDIT_requires:
    - every_authority_hash_matches
    - strict_v1_NO_GO_and_12_of_57_are_preserved
    - all_202_nonlateral_fields_pass_unchanged_strict_v1_gate
    - observed_physical_lateral_fields_pass_the_preregistered_analytic_bounds
    - observed_cancellation_residues_pass_the_preregistered_roundoff_bound
    - accepted_v1_row_proves_both_implementations_passed_the_original_controller_hard_gate
    - every_synthetic_negative_control_passes
    - no_solver_or_57_row_execution_occurs
  GO_meaning: >-
    authorize_only_a_separately_versioned_frozen_57_row_equivalence_v2_audit
    after_fresh_user_authorization
  GO_does_not_mean:
    - optimized_candidate_equivalence_passed
    - runtime_readiness_authorized
    - formal_campaign_authorized
    - Phase1_scientific_claim_supported
  otherwise: STOP_S2_ACTIVATE_GAMMA_SUB

allowed_final_dispositions:
  - GO_VERSIONED_EQUIVALENCE_V2_AUDIT
  - STOP_S2_ACTIVATE_GAMMA_SUB

