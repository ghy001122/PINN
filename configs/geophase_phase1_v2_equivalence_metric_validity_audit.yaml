unresolved_problem:
  observation: >-
    strict-equivalence-v1 applies one self-normalized relative comparator to
    primary physical fields, physical lateral fluxes, hard-gate diagnostics,
    and near-zero cancellation residues.
  decision_question: >-
    determine whether this is a general metric-category error without
    reclassifying physical x/y flux or net cell outflow as telemetry.
  forbidden_shortcut: reclassify_all_lateral_fields_as_nonvoting

field_categories:
  primary_strict:
    selection: all_v1_numeric_fields_except_the_lateral_fields_listed_below
    voting: true
    comparator: strict_equivalence_v1_normalized_relative_difference
    threshold: 1.0e-12
    threshold_change: forbidden
  no_flux_boundary:
    suffixes:
      - lateral.boundary_face_flux_W
      - lateral.boundary_outflow_W
    voting: true
    comparator: strict_equivalence_v1_normalized_relative_difference
    threshold: 1.0e-12
  physical_lateral_flux:
    suffixes:
      - lateral.x_face_flux_W
      - lateral.y_face_flux_W
      - lateral.net_cell_outflow_W
    voting: true
    comparator: analytic_mixed_absolute_bound
    threshold_ratio: 1.0
    empirical_multiplier: forbidden
    temperature_difference_source: matching_path_state_temperature_K_v1_detail
    temperature_scale_source: matching_path_state_temperature_K_v1_denominator
    flux_scale_source: matching_v1_lateral_field_denominator
    x_face_bound: >-
      2*g_x_max*delta_T_inf + 64*machine_epsilon*max(g_x_max*T_scale, q_scale)
    y_face_bound: >-
      2*g_y_max*delta_T_inf + 64*machine_epsilon*max(g_y_max*T_scale, q_scale)
    net_cell_bound: >-
      L_infinity_norm*delta_T_inf + 64*machine_epsilon*max(L_infinity_norm*T_scale, q_scale)
    coefficient_source: frozen_source_corrected_v3_grid_and_S2_sheet_conductance
  lateral_hard_gate_diagnostics:
    suffixes:
      - lateral.matrix_face_relative_mismatch
      - lateral.matrix_face_roundoff_ratio
    voting: true
    comparator: exact_hard_gate_disposition
    predicate: matrix_face_relative_mismatch_le_1e-10_OR_matrix_face_roundoff_ratio_le_1
    raw_cross_implementation_relative_equality: invalid_for_this_category
    required: candidate_and_oracle_each_pass_and_dispositions_match
  cancellation_roundoff_diagnostics:
    suffixes:
      - lateral.internal_pair_cancellation_W
      - lateral.face_to_cell_global_residual_W
    voting: true
    comparator: analytic_roundoff_bound
    threshold_ratio: 1.0
    empirical_multiplier: forbidden
    bound: >-
      64*machine_epsilon*2*(n_x_faces*q_x_scale+n_y_faces*q_y_scale)
    raw_values_preserved: true

observed_v1_audit_checks:
  expected_numeric_fields_in_failing_row: 229
