name: fast validation

on:
  push:
    paths:
      - ".github/workflows/**"
      - ".codex/**"
      - "configs/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "docs/paper/**"
      - "docs/AGENTS.md"
      - "docs/project_prompts/**"
      - "docs/research_strategy/**"
      - "docs/project_state/**"
      - "docs/manuscript/**"
      - "docs/templates/**"
      - "docs/archive/**"
      - "docs/codex_reports/**"
      - "docs/method_equations.md"
      - "outputs/tables/**"
      - "AGENTS.md"
      - "README.md"
      - "PROJECT_GOAL.md"
      - "CODEX_CONTEXT.md"
      - "PROJECT_STATE.md"
      - "NEXT_ACTIONS.md"
      - "LIVE_WORKSPACE.md"
      - "EXPERIMENT_REGISTRY.md"
      - "DATASET_REGISTRY.md"
      - "FIGURE_REGISTRY.md"
      - "requirements.txt"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".codex/**"
      - "configs/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "docs/paper/**"
      - "docs/AGENTS.md"
      - "docs/project_prompts/**"
      - "docs/research_strategy/**"
      - "docs/project_state/**"
      - "docs/manuscript/**"
      - "docs/templates/**"
      - "docs/archive/**"
      - "docs/codex_reports/**"
      - "docs/method_equations.md"
      - "outputs/tables/**"
      - "AGENTS.md"
      - "README.md"
      - "PROJECT_GOAL.md"
      - "CODEX_CONTEXT.md"
      - "PROJECT_STATE.md"
      - "NEXT_ACTIONS.md"
      - "LIVE_WORKSPACE.md"
      - "EXPERIMENT_REGISTRY.md"
      - "DATASET_REGISTRY.md"
      - "FIGURE_REGISTRY.md"
      - "requirements.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: fast-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PINN_PUBLIC_CHECKOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Focused evidence and claim tests
        run: >-
          python -m pytest
          tests/test_repository_realignment_audit.py
          tests/test_geophase_phase1_preregistration.py
          tests/test_geophase_phase1_v2_preregistration.py
          tests/test_geophase_phase1_v2_execution_addendum.py
          tests/test_geophase_phase1_v2_controller_v2_preregistration.py
          tests/test_geophase_phase1_v2_controller_v2.py
          tests/test_geophase_phase1_v2_controller_v2_readiness_evidence.py
          tests/test_geophase_phase1_v2_source_corrected_v3_preregistration.py
          tests/test_geophase_phase1_v2_source_corrected_v3_active_routing.py
          tests/test_geophase_phase1_v2_source_corrected_performance_repair_preregistration.py
          tests/test_geophase_phase1_v2_source_corrected_performance_electrical.py
          tests/test_geophase_phase1_v2_source_corrected_performance_coupled.py
          tests/test_geophase_phase1_v2_source_corrected_performance_oracle.py
          tests/test_geophase_phase1_v2_source_corrected_performance_equivalence.py
          tests/test_geophase_phase1_v2_source_corrected_performance_adapter.py
          tests/test_geophase_phase1_v2_source_corrected_readiness_journal.py
          tests/test_geophase_phase1_v2_source_corrected_runtime_pool.py
          tests/test_geophase_phase1_v2_source_corrected_performance_closure_runner.py
          tests/test_geophase_phase1_v2_equivalence_metric_validity_preregistration.py
          tests/test_geophase_phase1_v2_equivalence_metric_validity.py
          tests/test_geophase_phase1_v2_equivalence_metric_validity_coverage.py
          tests/test_geophase_phase1_v2_equivalence_metric_validity_coverage_correction.py
          tests/test_geophase_phase1_s1_diffusive_mve_v2_preregistration.py
          tests/test_geophase_phase1_s1_diffusive_mve.py
          tests/test_geophase_phase1_v2_solver.py
          tests/test_geophase_phase1_v2_smoke_evidence.py
          tests/test_geophase_phase1_v2_runtime_equivalence.py
          tests/test_geophase_phase1_v2_streaming.py
          tests/test_geophase_phase1_v2_dormant_runner.py
          tests/test_geophase_phase1_v2_runtime_readiness_evidence.py
          tests/test_qiu_same_device_thermal_holdout_audit.py
          tests/test_geophase_phase1_solver.py
          tests/test_geophase_phase1_checkpoint_a_evidence.py
          tests/test_geophase_phase1_vertical_repair_preregistration.py
          tests/test_geophase_phase1_vertical_repair.py
          tests/test_geophase_phase1_vertical_repair_evidence.py
          tests/test_geophase_phase1_vertical_shape_scale_v8_preregistration.py
          tests/test_geophase_phase1_vertical_shape_scale_v8.py
          tests/test_geophase_phase1_vertical_shape_scale_v8_runner.py
          tests/test_geophase_phase1_vertical_shape_scale_v8_evidence.py
          tests/test_gamma_sub_calibration_protocol_cost_frontier.py
          tests/test_gamma_sub_cpcf_evidence_schema.py
          tests/test_historical_evidence_manifest.py
          tests/test_prompt31_cpcf_semantic_audit.py
          tests/test_gamma_sub_ceba_contract.py
          tests/test_gamma_sub_ceba_evidence_schema.py
          tests/test_validation_workflow_contract.py
          tests/test_gamma_sub_evidence_lock.py
          tests/test_claim_gate_resolution_matrix.py -q
      - name: Current immutable evidence manifest
        run: python scripts/validate_historical_evidence_manifest.py
      - name: Fast checkout governance scope
        run: python scripts/audit_project_governance.py --no-write --fast-checkout
      - name: Strict tracked JSON parse
        run: python scripts/validate_tracked_json.py
      - name: Validation is read-only
        run: git diff --exit-code
